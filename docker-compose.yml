services:
  # Banco de metadados da plataforma. Guarda tenants, usuários, conexões,
  # dicionário semântico e histórico de chat — nunca o dado do cliente.
  # O dado do cliente fica no banco do cliente e é consultado sob demanda.
  postgres:
    image: postgres:16-alpine
    container_name: nextgen_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nextgen_bi}
      POSTGRES_USER: ${DB_USER:-nextgen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "-c timezone=America/Sao_Paulo"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Só loopback: quem entra é o Nginx do host, não a internet.
    ports:
      - "127.0.0.1:5433:5432"
    networks: [nextgen_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nextgen} -d ${DB_NAME:-nextgen_bi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cache de resultado, blacklist de JWT e fila. O cache é parte da tese de
  # custo: pergunta repetida não deve custar nem LLM nem varredura de banco.
  redis:
    image: redis:7-alpine
    container_name: nextgen_redis
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks: [nextgen_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_api
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [nextgen_network]
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  nextgen_network:
    driver: bridge
